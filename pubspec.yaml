name: device_security_plus
description: A Flutter plugin to retrieve unique device identifiers and monitor real-time security statuses (VPN, Debug Mode, USB Connection) across iOS and Android.
version: 1.0.3
homepage: https://github.com/etranzact-gh/device-security

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  plugin_platform_interface: ^2.0.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  plugin:
    platforms:
      android:
        package: com.etranzact.gh.device_security_plus
        pluginClass: DeviceSecurityPlugin
      ios:
        pluginClass: DeviceSecurityPlugin


